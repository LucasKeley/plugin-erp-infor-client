<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f6f8;
    }

    header {
      background: #1a5276;
      color: #fff;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      width: 100%;
      padding: 10px;
      background: #1a5276;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover { background: #154360; }
    button:active { background: #0e2d40; }

    #resultado {
      background: #fff;
      border: 1px solid #d5e8f0;
      border-radius: 6px;
      padding: 12px 14px;
      display: none;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .label {
      font-size: 11px;
      color: #7f8c8d;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .valor {
      font-size: 15px;
      font-weight: 700;
      color: #1a5276;
    }

    .valor-sm {
      font-size: 13px;
      font-weight: 500;
      color: #2c3e50;
    }

    #erro {
      display: none;
      background: #fdecea;
      border: 1px solid #f5c6c2;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 12px;
      color: #a93226;
    }
  </style>
</head>
<body>
  <header>Tempo de Contrato</header>
  <div class="body">
    <button id="btn">Coletar dados da página</button>

    <div id="resultado">
      <div class="row" id="box-numero">
        <div class="label">Número do contrato</div>
        <div class="valor" id="res-numero"></div>
      </div>
      <div class="row" id="box-tipo">
        <div class="label">Tipo</div>
        <div class="valor-sm" id="res-tipo"></div>
      </div>
      <div class="row">
        <div class="label">Vigência inicial</div>
        <div class="valor-sm" id="res-data"></div>
      </div>
      <div class="row">
        <div class="label">Tempo desde a ativação</div>
        <div class="valor" id="res-tempo"></div>
      </div>
    </div>

    <div id="erro"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
